        <!-- Top bar -->
        <div class="topbar">
            <div class="topbar-left">
                <button class="btn btn-icon" @click="toggleSidebar()" title="Toggle sidebar">☰</button>
                <span class="topbar-title">Janito Web</span>
            </div>
            <div class="topbar-actions">

                <!-- Provider combo (issue #34): lists the providers that
                     have an API key set; picking one switches the provider
                     for this browser/server session only (in memory) — it
                     applies to the very next prompt but is NOT persisted to
                     ~/.janito/config.json. -->
                <div class="provider-switcher" x-data="providerSwitcherComponent()">
                    <span class="ps-bolt" aria-hidden="true" :class="{ swapping: busy }">⚡</span>
                    <select class="provider-combo"
                            x-model="selected"
                            @change="applyProvider()"
                            :disabled="busy"
                            :class="{ swapping: busy }"
                            :title="'Active provider: ' + selected + (selectedModel ? ' · ' + selectedModel : '')">
                        <template x-for="p in available" :key="p.name">
                            <option :value="p.name"
                                    :disabled="!p.api_key_set"
                                    x-text="p.name + (p.api_key_set ? '' : ' · no key')"></option>
                        </template>
                    </select>
                    <span class="ps-spinner" x-show="busy" aria-hidden="true"></span>
                </div>

                <button class="btn" @click="toggleMcp()" title="MCP services">🔌 MCP</button>
                <button class="btn" @click="toggleSettings()" title="Settings">⚙ Settings</button>
                <button class="theme-toggle" @click="toggleTheme()"
                        :title="theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
                        :aria-label="theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'">
                    <span class="theme-icon sun" aria-hidden="true">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="2" stroke-linecap="round">
                            <circle cx="12" cy="12" r="5"/>
                            <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                            <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                        </svg>
                    </span>
                    <span class="theme-icon moon" aria-hidden="true">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                        </svg>
                    </span>
                    <span class="theme-knob" :class="{ dark: theme === 'dark' }"></span>
                </button>
            </div>
        </div>
