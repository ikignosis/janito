        <!-- Input area — only shown while a session is active. When the last
             session is closed (zero sessions left), there is nothing to send
             a message to, so the box and Send button are hidden until the
             user selects or creates a conversation in the sidebar. -->
        <div class="input-area" x-show="sessionId">
            <div class="input-inner">
                <textarea x-ref="input"
                          x-model="input"
                          @keydown="onKeydown($event)"
                          @input="_autoResize()"
                          rows="1"
                          placeholder="Send a message… (Enter to send, Shift+Enter for newline, Ctrl+C to stop, F2 to clear)"></textarea>
                <button class="btn btn-primary"
                        @click="sendPrompt()"
                        :disabled="!input.trim() || status !== 'idle'">
                    Send
                </button>
            </div>
        </div>
