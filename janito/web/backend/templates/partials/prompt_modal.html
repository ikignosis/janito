    <!-- ============ In-browser question panel (AskUser tool) ============
         Shown when the assistant raises a question that needs the user's
         answer (the AskUser tool). The backend blocks the agent turn until
         the answer is posted back as {"type": "prompt_answer", ...}.

         Presented as a NON-MODAL bottom sheet (not a centered modal with a
         dimmed full-screen backdrop) so the conversation stays fully
         visible and scrollable behind it: the user can review the chat
         window before answering, then submit in place.

         Lives in the ROOT app component (not the chat component) so the
         question is presented even when the session that asked it is in
         the background; the answer is routed back over that session's
         socket by the chat component (janito-prompt-answer event). -->
    <template x-if="promptModal">
        <div class="prompt-panel" role="dialog" aria-modal="false"
             aria-labelledby="prompt-panel-title"
             @keydown.escape.window="dismissPrompt()">
            <div class="modal-head">
                <h3 id="prompt-panel-title">&#128064; Question from the assistant</h3>
                <!-- Which conversation asked (useful when the question comes
                     from a background session). Hidden when unknown. -->
                <span class="prompt-session" x-show="promptModal.title"
                      :title="promptModal.title"
                      x-text="promptModal.title"></span>
                <button class="btn btn-icon modal-close" @click="dismissPrompt()"
                        aria-label="Close">&#10005;</button>
            </div>
            <div class="modal-desc prompt-question"
                 x-html="renderPromptQuestion(promptModal.question)"></div>
            <textarea id="prompt-panel-input" class="prompt-input" rows="2"
                      x-model="promptAnswer"
                      @keydown.enter.prevent="submitPromptAnswer()"
                      placeholder="Type your answer&#8230;"></textarea>
            <div class="prompt-hint">
                The conversation stays visible behind this panel &#8212; scroll to
                review it before answering.
            </div>
            <div class="modal-actions">
                <button class="btn" @click="dismissPrompt()">Dismiss</button>
                <button class="btn btn-primary" @click="submitPromptAnswer()">
                    Submit
                </button>
            </div>
        </div>
    </template>
