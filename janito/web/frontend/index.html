<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Janito Web</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">

    <!-- Apply the saved theme BEFORE first paint (light is the default) -->
    <script>
        try {
            var saved = localStorage.getItem('janito-theme');
            if (saved === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        } catch (e) { /* storage unavailable — fall back to light */ }
    </script>

    <!-- Theme -->
    <link rel="stylesheet" href="/css/theme.css">
    <!-- highlight.js theme -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release/build/styles/tokyo-night-dark.min.css">

    <!-- Libraries (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release/build/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>

    <!-- Alpine.js (must be deferred so components are defined first) -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>

    <!-- App scripts (order matters: helpers first). -->
    <script src="/js/api.js"></script>
    <script src="/js/markdown.js"></script>
    <script src="/js/websocket.js"></script>
    <!-- chat.js mixins (loaded before chat.js, which Object.assigns them) -->
    <script src="/js/chatFormat.js"></script>
    <script src="/js/chatMessages.js"></script>
    <script src="/js/chatStore.js"></script>
    <script src="/js/chatEvents.js"></script>
    <script src="/js/chatHistory.js"></script>
    <script src="/js/chatScroll.js"></script>
    <script src="/js/chatCommands.js"></script>
    <script src="/js/chat.js"></script>
    <script src="/js/sessions.js"></script>
    <script src="/js/settings.js"></script>
    <script src="/js/mcp.js"></script>
    <script src="/js/statusBar.js"></script>
    <script src="/js/providerSwitcher.js"></script>
    <script src="/js/app.js"></script>
</head>
<body>

<div class="app-layout" x-data="appComponent()" x-cloak>

    <!-- ============ Sidebar (sessions) ============ -->
    <aside class="sidebar" x-show="sidebarOpen"
           x-data="sessionsComponent()" x-ref="sessions">
        <div class="sidebar-header">
            <span class="sidebar-title">⚡ Janito</span>
            <button class="btn btn-icon" @click="create()" title="New conversation">＋</button>
        </div>

        <div class="session-list">
            <template x-if="loading">
                <div class="empty-state padded">Loading…</div>
            </template>
            <template x-for="s in sessions" :key="s.session_id">
                <div class="session-item"
                     :class="{ active: s.session_id === activeId }"
                     @click="select(s.session_id)">
                    <span class="session-indicator is-spinning"
                          x-show="indicatorState(s.session_id) === 'spinner'"></span>
                    <span class="session-indicator is-dot"
                          x-show="indicatorState(s.session_id) === 'dot'"></span>
                    <span class="title" x-text="s.title || 'New conversation'"></span>
                    <button class="delete" @click="remove(s.session_id, $event)" title="Delete">✕</button>
                </div>
            </template>
            <template x-if="!loading && sessions.length === 0">
                <div class="empty-state padded-sm">No conversations yet</div>
            </template>
        </div>

        <div class="sidebar-footer">
            <button class="btn flex-1" @click="create()">New Chat</button>
        </div>
    </aside>

    <!-- ============ Main content ============ -->
    <div class="main-content"
         x-data="chatComponent()" x-ref="chat">

        <!-- Top bar -->
        <div class="topbar">
            <div class="topbar-left">
                <button class="btn btn-icon" @click="toggleSidebar()" title="Toggle sidebar">☰</button>
                <span class="topbar-title">Janito Web</span>
            </div>
            <div class="topbar-actions">

                <!-- Provider combo (issue #34): lists the providers that
                     have an API key set; picking one switches the provider
                     for this browser/server session only (in memory) — it
                     applies to the very next prompt but is NOT persisted to
                     ~/.janito/config.json. -->
                <div class="provider-switcher" x-data="providerSwitcherComponent()">
                    <span class="ps-bolt" aria-hidden="true" :class="{ swapping: busy }">⚡</span>
                    <select class="provider-combo"
                            x-model="selected"
                            @change="applyProvider()"
                            :disabled="busy"
                            :class="{ swapping: busy }"
                            :title="'Active provider: ' + selected + (selectedModel ? ' · ' + selectedModel : '')">
                        <template x-for="p in available" :key="p.name">
                            <option :value="p.name"
                                    :disabled="!p.api_key_set"
                                    x-text="p.name + (p.api_key_set ? '' : ' · no key')"></option>
                        </template>
                    </select>
                    <span class="ps-caret" aria-hidden="true">▾</span>
                    <span class="ps-spinner" x-show="busy" aria-hidden="true"></span>
                </div>

                <button class="btn" @click="toggleMcp()" title="MCP services">🔌 MCP</button>
                <button class="btn" @click="toggleSettings()" title="Settings">⚙ Settings</button>
                <button class="theme-toggle" @click="toggleTheme()"
                        :title="theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
                        :aria-label="theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'">
                    <span class="theme-icon sun" aria-hidden="true">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="2" stroke-linecap="round">
                            <circle cx="12" cy="12" r="5"/>
                            <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                            <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                        </svg>
                    </span>
                    <span class="theme-icon moon" aria-hidden="true">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                        </svg>
                    </span>
                    <span class="theme-knob" :class="{ dark: theme === 'dark' }"></span>
                </button>
            </div>
        </div>

        <!-- Chat area -->
        <div class="chat-area-wrapper">
        <div class="chat-area" x-ref="chatArea">
            <div class="chat-inner">

                <!-- Session start: tools summary (sent by the backend when
                     the WebSocket connects — web counterpart of the CLI's
                     startup "N tools active, M skipped" line). The active
                     count is a link that opens the tools info dialog (same
                     data as the /tools command). -->
                <template x-if="toolsSummary">
                    <div class="session-start-banner">
                        <span class="ssb-main">
                            ⚡ <a href="#" class="ssb-tools-link"
                                  @click.prevent="openToolsDialog()"
                                  title="View tools info">
                                <strong x-text="toolsSummary.active"></strong> tool(s) active
                            </a>
                            <span class="ssb-sep">·</span>
                            <strong x-text="toolsSummary.skipped"></strong> skipped
                        </span>
                        <template x-if="toolsSummary.skipped > 0">
                            <details class="ssb-details">
                                <summary>why?</summary>
                                <ul class="ssb-skipped-list">
                                    <template x-for="(reason, name) in toolsSummary.skippedList" :key="name">
                                        <li><code x-text="name"></code> — <span x-text="reason"></span></li>
                                    </template>
                                </ul>
                            </details>
                        </template>
                    </div>
                </template>

                <!-- Empty state -->
                <template x-if="messages.length === 0">
                    <div class="empty-state">
                        <h2>⚡ Janito Web</h2>
                        <p>Start a conversation below. Streaming responses, tool calls, and MCP services are all live.</p>
                    </div>
                </template>

                <!-- Messages -->
                <template x-for="(msg, idx) in messages" :key="idx">
                    <div class="message" :class="msg.role">
                        <div class="avatar" :class="msg.role"
                             x-text="msg.role === 'user' ? 'U' : '⚡'"></div>
                        <div class="message-body">

                            <!-- Message parts rendered in arrival order:
                                 reasoning cards, text, and tool-call cards are
                                 interleaved exactly as the model produced them.
                                 NOTE: x-for requires a SINGLE child element, so
                                 all part variants are wrapped in one div. -->
                            <template x-for="(part, pi) in msg.parts" :key="pi">
                                <div>
                                    <!-- Reasoning card -->
                                    <template x-if="part.kind === 'reasoning'">
                                        <div class="reasoning-panel">
                                            <div class="reasoning-header" @click="part.open = !part.open">
                                                <span x-text="part.open ? '▼' : '▶'"></span>
                                                💭 Reasoning
                                            </div>
                                            <div class="reasoning-body" x-show="part.open" x-text="part.text"></div>
                                        </div>
                                    </template>

                                    <!-- Assistant text (markdown) -->
                                    <template x-if="part.kind === 'text'">
                                        <div x-html="renderMarkdown(part.text)"></div>
                                    </template>

                                    <!-- Tool call card -->
                                    <template x-if="part.kind === 'tool'">
                                        <div class="tool-card">
                                            <div class="tool-card-header" @click="part.tool.open = !part.tool.open">
                                                <span x-text="part.tool.open ? '▼' : '▶'" class="muted"></span>
                                                <span class="tool-name" x-text="part.tool.name"></span>
                                                <template x-if="toolSummary(part.tool.name, part.tool.args)">
                                                    <span class="tool-path" x-text="toolSummary(part.tool.name, part.tool.args)"></span>
                                                </template>
                                                <template x-if="permLabel(part.tool.permissions)">
                                                    <span class="perm-badge" :class="permClass(part.tool.permissions)"
                                                          x-text="permLabel(part.tool.permissions)"></span>
                                                </template>
                                                <span class="tool-status" :class="part.tool.status">
                                                    <template x-if="part.tool.status === 'running'">
                                                        <span><span class="spinner"></span> Running</span>
                                                    </template>
                                                    <template x-if="part.tool.status === 'done'">
                                                        <span>✅ Done<template x-if="part.tool.execution_time_ms != null"><span class="tool-exec-time" x-text="'· ' + formatDuration(part.tool.execution_time_ms)"></span></template></span>
                                                    </template>
                                                    <template x-if="part.tool.status === 'error'">
                                                        <span>❌ Error</span>
                                                    </template>
                                                </span>
                                            </div>

                                            <div class="tool-card-body" x-show="part.tool.open">
                                                <!-- Arguments -->
                                                <div class="tool-args-toggle" @click.stop="part.tool.argsOpen = !part.tool.argsOpen">
                                                    Arguments <span x-text="part.tool.argsOpen ? '▾' : '▸'"></span>
                                                </div>
                                                <template x-if="part.tool.argsOpen">
                                                    <div class="tool-args" x-text="toolArgsStr(part.tool.args)"></div>
                                                </template>

                                                <!-- Live progress / output -->
                                                <template x-for="(p, ppi) in part.tool.progress" :key="ppi">
                                                    <div class="tool-progress" :class="p.level">
                                                        <template x-if="p.level !== 'output' && p.level !== 'diff'">
                                                            <span><span class="level-tag" x-text="levelIcon(p.level)"></span><span x-text="p.message"></span></span>
                                                        </template>
                                                        <template x-if="p.level === 'diff'">
                                                            <span x-text="p.message" class="pre-wrap"></span>
                                                        </template>
                                                        <template x-if="p.level === 'output'">
                                                            <span x-text="p.message" class="pre-wrap"></span>
                                                        </template>
                                                    </div>
                                                </template>

                                                <!-- Result -->
                                                <template x-if="part.tool.result !== null || part.tool.error">
                                                    <div>
                                                        <div class="tool-result-toggle" @click.stop="part.tool.resultOpen = !part.tool.resultOpen">
                                                            Result <span x-text="part.tool.resultOpen ? '▾' : '▸'"></span>
                                                        </div>
                                                        <template x-if="part.tool.resultOpen">
                                                            <div class="tool-result"
                                                                 :class="{ 'has-error': part.tool.error }"
                                                                 x-text="part.tool.error ? part.tool.error : toolResultStr(part.tool.result)"></div>
                                                        </template>
                                                    </div>
                                                </template>
                                            </div>
                                        </div>
                                    </template>

                                    <!-- SVG content card (CreateSVG tool result) -->
                                    <template x-if="part.kind === 'svg'">
                                        <div class="svg-card" x-html="sanitizeSvg(part.svg, part.view_width, part.view_height)"></div>
                                    </template>

                                    <!-- Image content card (CreateImage tool result) -->
                                    <template x-if="part.kind === 'image'">
                                        <div class="image-card">
                                            <img :src="imageUrl(part.path)" alt="Generated image" loading="lazy">
                                        </div>
                                    </template>

                                    <!-- /tools listing panel -->
                                    <template x-if="part.kind === 'tools'">
                                        <div class="tools-panel">
                                            <template x-if="part.loading">
                                                <div class="tools-panel-loading">
                                                    <span class="spinner"></span> Loading tools…
                                                </div>
                                            </template>

                                            <template x-if="!part.loading && part.error">
                                                <div class="tools-panel-error">⚠ <span x-text="part.error"></span></div>
                                            </template>

                                            <template x-if="!part.loading && !part.error && part.tools">
                                                <div>
                                                    <div class="tools-panel-header">
                                                        <span class="tools-panel-title">🔧 Available Tools</span>
                                                        <span class="tools-panel-count"
                                                              x-text="part.tools.total + ' tool' + (part.tools.total === 1 ? '' : 's')"></span>
                                                    </div>

                                                    <!-- Built-in tools -->
                                                    <div class="tools-section">
                                                        <div class="tools-section-title">Built-in Tools</div>
                                                        <template x-if="part.tools.builtin.length === 0">
                                                            <div class="tools-empty">(none loaded)</div>
                                                        </template>
                                                        <template x-for="t in part.tools.builtin" :key="t.name">
                                                            <div class="tools-row">
                                                                <span class="tools-row-name" x-text="t.name"></span>
                                                                <template x-if="permLabel(t.permissions)">
                                                                    <span class="perm-badge" :class="permClass(t.permissions)"
                                                                          x-text="permLabel(t.permissions)"></span>
                                                                </template>
                                                                <span class="tools-row-desc" x-text="t.description"></span>
                                                            </div>
                                                        </template>
                                                    </div>

                                                    <!-- Skipped tools (collapsible) -->
                                                    <template x-if="Object.keys(part.tools.skipped).length > 0">
                                                        <details class="tools-section tools-skipped">
                                                            <summary class="tools-section-title">
                                                                Skipped Tools
                                                                <span class="tools-skipped-count"
                                                                      x-text="'(' + Object.keys(part.tools.skipped).length + ')'"></span>
                                                            </summary>
                                                            <template x-for="(reason, name) in part.tools.skipped" :key="name">
                                                                <div class="tools-row">
                                                                    <span class="tools-row-name" x-text="name"></span>
                                                                    <span class="tools-row-desc tools-row-reason" x-text="reason"></span>
                                                                </div>
                                                            </template>
                                                        </details>
                                                    </template>

                                                    <!-- MCP tools -->
                                                    <div class="tools-section">
                                                        <div class="tools-section-title">MCP Tools</div>
                                                        <template x-if="part.tools.mcp.length === 0">
                                                            <div class="tools-empty">(no MCP services connected)</div>
                                                        </template>
                                                        <template x-for="t in part.tools.mcp" :key="t.name">
                                                            <div class="tools-row">
                                                                <span class="tools-row-name" x-text="t.name"></span>
                                                                <span class="tools-row-desc" x-text="t.description"></span>
                                                            </div>
                                                        </template>
                                                    </div>

                                                    <div class="tools-panel-footer">
                                                        <span x-text="part.tools.total + ' tools (' + part.tools.builtin.length + ' built-in, ' + part.tools.mcp.length + ' MCP)'"></span>
                                                    </div>
                                                </div>
                                            </template>
                                        </div>
                                    </template>
                                </div>
                            </template>

                            <!-- User text (plain, escaped via textContent) -->
                            <template x-if="msg.role === 'user'">
                                <div x-text="msg.content" class="pre-wrap"></div>
                            </template>

                            <!-- Waiting indicator (no content yet) -->
                            <template x-if="msg.streaming && msg.parts.length === 0 && (status === 'waiting')">
                                <div class="waiting">
                                    <span class="dot-pulse"><span></span><span></span><span></span></span>
                                    Thinking…
                                </div>
                            </template>

                            <!-- Cancelled indicator -->
                            <template x-if="msg.cancelled">
                                <div class="cancelled-notice">⏹ Generation stopped by the user</div>
                            </template>

                            <!-- Usage -->
                            <template x-if="msg.usage">
                                <div class="usage-strip" role="note"
                                     :aria-label="'Tokens: ' + formatTokens(msg.usage.total) + ' total, ' + formatTokens(msg.usage.input) + ' input, ' + formatTokens(msg.usage.output) + (msg.usage.max_tokens ? '/' + formatTokens(msg.usage.max_tokens) : '') + ' output' + (msg.usage.cached ? ', ' + formatTokens(msg.usage.cached) + ' cached' : '')">
                                    <span class="usage-chip usage-total" title="Total tokens used for this response">
                                        <span class="usage-label">tokens</span>
                                        <span class="usage-value" x-text="formatTokens(msg.usage.total)"></span>
                                    </span>
                                    <span class="usage-chip" title="Input tokens sent to the model">
                                        <span class="usage-label">in</span>
                                        <span class="usage-value" x-text="formatTokens(msg.usage.input)"></span>
                                    </span>
                                    <span class="usage-chip" title="Output tokens generated by the model / max output tokens">
                                        <span class="usage-label">out</span>
                                        <span class="usage-value" x-text="formatTokens(msg.usage.output) + (msg.usage.max_tokens ? '/' + formatTokens(msg.usage.max_tokens) : '')"></span>
                                    </span>
                                    <template x-if="msg.usage.cached">
                                        <span class="usage-chip usage-cached" title="Input tokens served from the provider's cache">
                                            <span class="usage-label">cached</span>
                                            <span class="usage-value" x-text="formatTokens(msg.usage.cached)"></span>
                                        </span>
                                    </template>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>

                <!-- Global error banner -->
                <template x-if="error">
                    <div class="message">
                        <div class="message-body message-error">
                            ⚠ <span x-text="error"></span>
                        </div>
                    </div>
                </template>
            </div>
        </div>

        <!-- Processing spinner — bottom-right of the chat area while a
             request is in flight (waiting / streaming / tool running).
             Uses the same spin effect as the session-tab indicators. -->
        <span class="chat-spinner"
              x-show="status === 'waiting' || status === 'streaming' || status === 'tool_running'"
              x-transition.opacity.duration.200ms
              aria-hidden="true"></span>

        <!-- "Jump to latest" — appears when the user scrolls up mid-stream.
             Pinned over the chat area; hidden again once at the bottom. -->
        <button class="jump-to-latest"
                x-show="!_followBottom"
                x-transition.opacity.duration.150ms
                @click="_forceScrollToBottom()"
                title="Jump to latest" aria-label="Jump to latest message">
            <span class="jump-dot" :class="{ live: status === 'streaming' || status === 'tool_running' }"></span>
            Jump to latest
            <span class="jump-arrow" aria-hidden="true">↓</span>
        </button>
        </div>

        <!-- Input area -->
        <div class="input-area">
            <div class="input-inner">
                <textarea x-ref="input"
                          x-model="input"
                          @keydown="onKeydown($event)"
                          @input="_autoResize()"
                          rows="1"
                          placeholder="Send a message… (Enter to send, Shift+Enter for newline, Ctrl+C to stop, F2 to restart)"></textarea>
                <button class="btn btn-primary"
                        @click="sendPrompt()"
                        :disabled="!input.trim() || status !== 'idle'">
                    Send
                </button>
            </div>
        </div>

        <!-- Status bar -->
        <div class="status-bar" x-data="statusBarComponent()">
            <div class="status-item">
                <span class="conn-dot" :class="connection"></span>
                <span x-text="connection"></span>
            </div>
            <div class="status-item"><strong>Model:</strong>
                <span x-show="model" x-text="model"></span>
                <span x-show="!model" class="muted">(not set)</span>
            </div>
            <div class="status-item"><strong>Provider:</strong> <span x-text="provider"></span></div>

            <div class="status-item gap-sm">
                <!-- Thinking is a runtime toggle (POST /api/config/thinking):
                     flips the effective state for the next prompt, in memory
                     only — not persisted to ~/.janito/config.json. -->
                <button type="button" class="flag-badge flag-toggle"
                        :class="{ active: config.thinking }"
                        @click="toggleThinking()"
                        :title="'Thinking ' + (config.thinking ? 'on' : 'off') + ' — click to toggle (runtime, not persisted)'"
                        :aria-pressed="config.thinking ? 'true' : 'false'">thinking</button>
                <span class="flag-badge" :class="{ active: config.gmail }">gmail</span>
                <span class="flag-badge" :class="{ active: config.onedrive }">onedrive</span>
                <span class="flag-badge" :class="{ active: privileges.read }">read</span>
                <span class="flag-badge" :class="{ active: privileges.write }">write</span>
                <span class="flag-badge" :class="{ active: privileges.exec }">exec</span>
            </div>

            <template x-if="lastUsage">
                <div class="status-item push-end">
                    <strong>Tokens:</strong>
                    <span x-text="formatTokens(lastUsage.total)"></span>
                    (in <span x-text="formatTokens(lastUsage.input)"></span> /
                    out <span x-text="formatTokens(lastUsage.output) + (lastUsage.max_tokens ? '/' + formatTokens(lastUsage.max_tokens) : '')"></span>)
                </div>
            </template>
        </div>

        <!-- ============ Tools info dialog ============
             Opened by the session-start banner's "N tool(s) active" link.
             Shows the same data as the /tools command (built-in, skipped and
             MCP tools) in a modal overlay instead of a chat message. -->
        <template x-if="toolsDialogOpen">
            <div class="modal-overlay" @click.self="closeToolsDialog()"
                 @keydown.escape.window="closeToolsDialog()">
                <div class="modal-card tools-dialog" role="dialog" aria-modal="true"
                     aria-labelledby="tools-dialog-title">
                    <div class="modal-head">
                        <h3 id="tools-dialog-title">🔧 Available Tools</h3>
                        <template x-if="toolsDialog && !toolsDialogLoading">
                            <span class="tools-panel-count"
                                  x-text="toolsDialog.total + ' tool' + (toolsDialog.total === 1 ? '' : 's')"></span>
                        </template>
                        <button class="btn btn-icon modal-close" @click="closeToolsDialog()"
                                aria-label="Close">✕</button>
                    </div>

                    <template x-if="toolsDialogLoading">
                        <div class="tools-panel-loading">
                            <span class="spinner"></span> Loading tools…
                        </div>
                    </template>

                    <template x-if="!toolsDialogLoading && toolsDialogError">
                        <div class="tools-panel-error">⚠ <span x-text="toolsDialogError"></span></div>
                    </template>

                    <template x-if="!toolsDialogLoading && !toolsDialogError && toolsDialog">
                        <div class="tools-dialog-body">
                            <!-- Built-in tools -->
                            <div class="tools-section">
                                <div class="tools-section-title">Built-in Tools</div>
                                <template x-if="toolsDialog.builtin.length === 0">
                                    <div class="tools-empty">(none loaded)</div>
                                </template>
                                <template x-for="t in toolsDialog.builtin" :key="t.name">
                                    <div class="tools-row">
                                        <span class="tools-row-name" x-text="t.name"></span>
                                        <template x-if="permLabel(t.permissions)">
                                            <span class="perm-badge" :class="permClass(t.permissions)"
                                                  x-text="permLabel(t.permissions)"></span>
                                        </template>
                                        <span class="tools-row-desc" x-text="t.description"></span>
                                    </div>
                                </template>
                            </div>

                            <!-- Skipped tools (collapsible) -->
                            <template x-if="Object.keys(toolsDialog.skipped).length > 0">
                                <details class="tools-section tools-skipped">
                                    <summary class="tools-section-title">
                                        Skipped Tools
                                        <span class="tools-skipped-count"
                                              x-text="'(' + Object.keys(toolsDialog.skipped).length + ')'"></span>
                                    </summary>
                                    <template x-for="(reason, name) in toolsDialog.skipped" :key="name">
                                        <div class="tools-row">
                                            <span class="tools-row-name" x-text="name"></span>
                                            <span class="tools-row-desc tools-row-reason" x-text="reason"></span>
                                        </div>
                                    </template>
                                </details>
                            </template>

                            <!-- MCP tools -->
                            <div class="tools-section">
                                <div class="tools-section-title">MCP Tools</div>
                                <template x-if="toolsDialog.mcp.length === 0">
                                    <div class="tools-empty">(no MCP services connected)</div>
                                </template>
                                <template x-for="t in toolsDialog.mcp" :key="t.name">
                                    <div class="tools-row">
                                        <span class="tools-row-name" x-text="t.name"></span>
                                        <span class="tools-row-desc" x-text="t.description"></span>
                                    </div>
                                </template>
                            </div>

                            <div class="tools-panel-footer">
                                <span x-text="toolsDialog.total + ' tools (' + toolsDialog.builtin.length + ' built-in, ' + toolsDialog.mcp.length + ' MCP)'"></span>
                            </div>
                        </div>
                    </template>

                    <div class="modal-actions">
                        <button class="btn" @click="closeToolsDialog()">Close</button>
                    </div>
                </div>
            </div>
        </template>
    </div>

    <!-- ============ Settings drawer ============ -->
    <template x-if="settingsOpen">
        <div class="drawer-overlay" @click.self="closeDrawers()"
             x-data="settingsComponent()" x-init="open=true; load()">
            <div class="drawer">
                <h2>⚙ Settings</h2>

                <template x-if="message && !hintMessage">
                    <div class="warning-text" x-text="message"></div>
                </template>

                <!-- Provider combobox (top) -->
                <div class="form-group">
                    <label>Provider</label>
                    <select x-model="selectedProvider" @change="onProviderChange()">
                        <template x-for="p in providers" :key="p.name">
                            <option :value="p.name" x-text="p.name"></option>
                        </template>
                    </select>
                    <div class="provider-hint">
                        <span x-show="selectedProviderDetail && selectedProviderDetail.active && !isStagedProviderSelected"
                              class="provider-active-badge">default</span>
                        <span x-show="selectedProviderDetail && !selectedProviderDetail.active && !isStagedProviderSelected"
                              class="hint-muted">not the default provider</span>
                        <span x-show="isStagedProviderSelected"
                              class="provider-pending-badge">default pending</span>
                        <button class="btn set-default-btn"
                                x-show="showSetDefault && !isStagedProviderSelected"
                                @click="setDefaultProvider()"
                                :disabled="!selectedProviderHasKey"
                                title="Stage this provider as the default — saved with Save">
                            Set Default
                        </button>
                        <button class="btn set-default-btn"
                                x-show="isStagedProviderSelected"
                                @click="unstageDefault()"
                                title="Discard the pending default change">
                            Cancel
                        </button>
                    </div>
                    <template x-if="hintMessage">
                        <div class="provider-confirm" x-text="hintMessage"></div>
                    </template>
                    <template x-if="defaultChanged && !isStagedProviderSelected">
                        <div class="pending-note">
                            Default change pending: <strong x-text="pendingDefaultProvider"></strong> — will be saved with Save.
                        </div>
                    </template>
                </div>

                <!-- Model override -->
                <div class="form-group">
                    <label>Model</label>
                    <input type="text" x-model="model" :placeholder="modelPlaceholder">
                </div>

                <div class="form-group">
                    <label>API Key</label>
                    <div class="api-key-row">
                        <input type="text" class="flex-1"
                               :value="status.api_key || ''" disabled
                               :class="{ 'key-unset': !status.api_key_set }">
                        <button class="btn set-key-btn"
                                @click="openKeyModal()"
                                :disabled="!selectedProvider"
                                title="Change the API key for the selected provider">
                            🔑 Set API Key
                        </button>
                    </div>
                    <div class="api-key-hint">
                        <!-- Neutral status for the selected provider; suppressed
                             while a key change is staged (the pending note above
                             is the only signal then). -->
                        <span x-show="!(pendingApiKey && pendingApiKey.provider === selectedProvider) && selectedProviderDetail && !selectedProviderDetail.api_key_set"
                              class="key-status unset">no key stored for this provider</span>
                    </div>
                    <template x-if="pendingApiKey">
                        <div class="pending-note">
                            API key change pending for <strong x-text="pendingApiKey.provider"></strong> — will be saved with Save.
                        </div>
                    </template>
                </div>

                <div class="drawer-actions">
                    <button class="btn btn-primary" @click="save()"
                            :disabled="saving || !canSave"
                            title="Save pending changes">Save</button>
                    <button class="btn" @click="closeDrawers()">Close</button>
                </div>

                <div class="fine-print">
                    <div><strong>Privileges:</strong>
                        read <span x-text="config.privileges?.read"></span> ·
                        write <span x-text="config.privileges?.write"></span> ·
                        exec <span x-text="config.privileges?.exec"></span>
                    </div>
                </div>
            </div>

            <!-- ===== "Set API Key" modal ===== -->
            <template x-if="keyModalOpen">
                <div class="modal-overlay" @click.self="closeKeyModal()"
                     @keydown.escape.window="closeKeyModal()">
                    <div class="modal-card" role="dialog" aria-modal="true"
                         aria-labelledby="key-modal-title">
                        <div class="modal-head">
                            <h3 id="key-modal-title">🔑 Set API Key</h3>
                            <span class="modal-provider-chip" x-text="selectedProvider"></span>
                            <button class="btn btn-icon modal-close" @click="closeKeyModal()"
                                    aria-label="Close">✕</button>
                        </div>

                        <p class="modal-desc">
                            The key is written to <code>~/.janito/auth.json</code> for
                            <strong x-text="selectedProvider"></strong> and is used by the
                            very next prompt — once you click <strong>Save</strong> in
                            the drawer. Closing the drawer discards it.
                        </p>

                        <div class="form-group">
                            <label for="api-key-input">API key</label>
                            <div class="key-input-wrap">
                                <input id="api-key-input" x-ref="keyInput"
                                       :type="keyReveal ? 'text' : 'password'"
                                       x-model="keyInput"
                                       class="mono"
                                       placeholder="sk-…"
                                       autocomplete="off" spellcheck="false"
                                       @keydown.enter="saveApiKey()">
                                <button class="btn btn-icon key-reveal" type="button"
                                        @click="keyReveal = !keyReveal"
                                        :title="keyReveal ? 'Hide key' : 'Show key'"
                                        :aria-pressed="keyReveal ? 'true' : 'false'"
                                        x-text="keyReveal ? '🙈' : '👁'"></button>
                            </div>
                        </div>

                        <template x-if="keyError">
                            <div class="modal-error" x-text="keyError"></div>
                        </template>

                        <div class="modal-actions">
                            <button class="btn" @click="closeKeyModal()">Cancel</button>
                            <button class="btn btn-primary" @click="saveApiKey()"
                                    :disabled="!keyInput.trim()">Set Key</button>
                        </div>
                    </div>
                </div>
            </template>
        </div>
    </template>

    <!-- ============ MCP drawer ============ -->
    <template x-if="mcpOpen">
        <div class="drawer-overlay" @click.self="closeDrawers()"
             x-data="mcpComponent()" x-init="open=true; load()">
            <div class="drawer">
                <h2>🔌 MCP Services</h2>

                <template x-if="message">
                    <div class="warning-text" x-text="message"></div>
                </template>

                <template x-if="loading">
                    <div class="empty-state padded">Loading…</div>
                </template>

                <template x-if="!loading && services.length === 0">
                    <div class="empty-state padded">
                        No MCP services configured.<br>
                        <small>Add services to <code>~/.janito/mcp_services.json</code></small>
                    </div>
                </template>

                <template x-for="svc in services" :key="svc.name">
                    <div class="mcp-service">
                        <div class="mcp-service-header">
                            <span class="conn-dot" :class="svc.connected ? 'connected' : 'disconnected'"></span>
                            <span class="mcp-service-name" x-text="svc.name"></span>
                            <span class="muted-tiny"
                                  x-text="svc.transport"></span>
                        </div>
                        <div class="row">
                            <template x-if="!svc.connected">
                                <button class="btn" @click="connect(svc.name)" :disabled="busy === svc.name">
                                    Connect
                                </button>
                            </template>
                            <template x-if="svc.connected">
                                <button class="btn" @click="disconnect(svc.name)" :disabled="busy === svc.name">
                                    Disconnect
                                </button>
                            </template>
                            <span class="muted-inline"
                                  x-text="svc.connected ? 'Connected' : 'Disconnected'"></span>
                        </div>
                    </div>
                </template>

                <div class="margin-top">
                    <button class="btn" @click="closeDrawers()">Close</button>
                </div>
            </div>
        </div>
    </template>

    <!-- ============ Toast (transient notifications) ============
         Kept mounted (x-show, not x-if) so the fade-out transition can
         complete before the message is cleared. -->
    <div class="toast"
         :class="toast ? toast.kind : ''"
         x-show="!!toast"
         x-transition.opacity.duration.200ms
         role="status"
         x-text="toast ? toast.text : ''"
         aria-live="polite"></div>

</div>

</body>
</html>
