[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "janito"
dynamic = ["version"]
description = "OpenAI CLI with Function Calling, MCP Support, and Extensible Tools"
readme = "README.md"
authors = [{name = "Janito Developer", email = "developer@example.com"}]
license = "MIT"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "rich>=10.0.0",
    "prompt-toolkit>=3.0.0",
    "requests>=2.28.0",
    "pathspec>=0.11.0",
    "questionary>=2.1.1",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110",
    "jinja2>=3.0",
    "uvicorn[standard]>=0.29",
    "websockets>=12.0",
]

[project.urls]
Homepage = "https://github.com/ikignosis/janito"
Repository = "https://github.com/ikignosis/janito"

[project.scripts]
janito = "janito.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["janito*"]

[tool.setuptools.package-data]
"janito.web" = [
    "backend/templates/*.html",
    "backend/templates/partials/*.html",
    "frontend/*.ico",
    "frontend/*.svg",
    "frontend/css/*.css",
    "frontend/js/*.js",
    "frontend/js/vendor/*.js",
]

[tool.setuptools_scm]
version_scheme = "post-release"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["C901", "E", "F", "W"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.isort]
profile = "black"

[tool.uv]
# Install the dev dependency group by default when running `uv sync`.
default-groups = ["dev"]

[dependency-groups]
dev = [
    "detect-secrets>=1.5.0",
    "pre-commit>=4.6.1",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.16.0",
    "tox>=4.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    "mkdocs-git-revision-date-localized-plugin>=1.2.0",
]
